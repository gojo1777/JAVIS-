name: Train and Chat-Test MY-AI

on:
  workflow_dispatch:

jobs:
  train-and-chat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build expanded dataset
        run: |
          python data/build_expanded_dataset.py

      - name: Validate dataset
        run: |
          python training/validate_dataset.py

      - name: Train model
        run: |
          python training/train.py

      - name: Chat test (Sinhala & Singlish prompts)
        run: |
          printf "ඔයා කවුද?\nකොහොමද?\nසින්හලන් පුලුවන්ද\npython gana kiyaham\nML කියන්නේ මොකක්ද?\nස්තුතියි\nexit\n" | python inference/inference.py

      - name: Upload model + logs
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-model
          path: |
            my_ai.pt
            my_ai_best.pt
            data/vocab.json
            training_log.txt
