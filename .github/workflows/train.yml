name: Train and Chat-Test MY-AI

# Trigger manually from the Actions tab ("Run workflow").
# GitHub Actions has no interactive terminal, so "chatting" here
# means: we send several prompts (memorized ones AND new ones the
# model hasn't seen) and print the replies to the run log, so you
# can read the conversation after the run finishes.
on:
  workflow_dispatch:

jobs:
  train-and-chat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dataset
        run: |
          python training/validate_dataset.py

      - name: Train model
        run: |
          python training/train.py

      - name: Chat test (prompts from training data)
        run: |
          printf "ඔයා කවුද?\nකොහොමද?\nස්තුතියි\nexit\n" | python inference/inference.py

      - name: Chat test (new / reworded prompts, not in training data)
        run: |
          printf "ML කියන්නේ මොකක්ද?\nHow can I learn to code?\nCan you teach me Python?\nexit\n" | python inference/inference.py

      - name: Upload model + logs
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-model
          path: |
            my_ai.pt
            my_ai_best.pt
            data/vocab.json
            training_log.txt
