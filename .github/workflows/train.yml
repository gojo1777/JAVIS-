name: Test MY-AI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check model files
        run: |
          test -f my_ai.pt
          test -f data/vocab.json

      - name: Test inference
        run: |
          printf "ඔයා කවුද?\nexit\n" | python inference/inference.py
